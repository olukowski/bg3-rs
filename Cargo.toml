[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "viewer"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
bg3-install = { path = "crates/bg3-install" }
bg3-pak = { path = "crates/bg3-pak" }
bg3-vfs = { path = "crates/bg3-vfs" }

anyhow = "1"
bevy = "0.20"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
lz4_flex = "0.14"
memmap2 = "0.9"
plist = "1.10"
quick-xml = "0.42"
serde_json = "1"
thiserror = "2"
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bevy is slow in debug builds; optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
